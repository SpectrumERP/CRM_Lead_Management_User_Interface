<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spectrum ERP CRM</title>
    <!-- Square Spectrum ERP icons (the old wide logo was squashed into the tab). -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- App shell paint before JS: same chrome as the Spectrum CRM and Task apps (blue sidebar,
         white header, canvas), so switching between the two apps never flashes a blank page. -->
    <script>
      // Theme before first paint (shared with Task Management: `steelmont-theme`; CRM default light).
      (function () {
        try {
          var t = localStorage.getItem('steelmont-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          if (localStorage.getItem('fi-crm-sidebar-collapsed') === '1') {
            document.documentElement.setAttribute('data-boot-sidebar', 'collapsed');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #f4f6fa;
      }

      html.dark,
      html.dark body {
        background: #0b1220;
      }

      /* Same-origin page swaps (CRM <-> Task) cross-fade instead of cutting. */
      @view-transition {
        navigation: auto;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 180ms;
        animation-timing-function: ease-out;
      }

      .boot-shell {
        display: flex;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #f4f6fa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      html.dark .boot-shell {
        background: #0b1220;
      }

      .boot-side {
        display: none;
        flex-shrink: 0;
        width: 224px;
        background: #1e56a0;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
      }

      html[data-boot-sidebar='collapsed'] .boot-side {
        width: 56px;
      }

      @media (min-width: 1024px) {
        .boot-side {
          display: block;
        }
      }

      .boot-main {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
      }

      .boot-head {
        flex-shrink: 0;
        height: 56px;
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
      }

      html.dark .boot-head {
        background: #121a2b;
        border-color: #2a3548;
      }

      .boot-body {
        position: relative;
        display: grid;
        flex: 1;
        place-items: center;
      }

      .crm-boot-track {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        overflow: hidden;
        background: #eef3fc;
      }

      html.dark .crm-boot-track {
        background: rgba(30, 86, 160, 0.25);
      }

      .crm-boot-bar {
        width: 40%;
        height: 100%;
        background-image: linear-gradient(135deg, #1e56a0, #c41e1e);
        animation: crm-boot-bar 1.1s ease-in-out infinite;
      }

      .crm-boot-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem;
      }

      .crm-boot-mark {
        position: relative;
        display: grid;
        width: 3.5rem;
        height: 3.5rem;
        place-items: center;
      }

      .crm-boot-halo {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #eef3fc;
        animation: crm-boot-pulse 1.4s ease-in-out infinite;
      }

      .crm-boot-ring {
        position: absolute;
        inset: 0.2rem;
        border-radius: 999px;
        border: 3px solid #eef3fc;
        border-top-color: #1e56a0;
        border-right-color: #c41e1e;
        animation: crm-boot-spin 0.75s linear infinite;
      }

      .crm-boot-core {
        position: relative;
        z-index: 1;
        display: grid;
        width: 1.75rem;
        height: 1.75rem;
        place-items: center;
        border-radius: 999px;
        background: #1e56a0;
        color: #fff;
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .crm-boot-label {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        color: #0c1a3a;
      }

      html.dark .crm-boot-label {
        color: #e2e8f0;
      }

      @keyframes crm-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes crm-boot-pulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.7;
        }

        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      @keyframes crm-boot-bar {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(320%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .crm-boot-halo,
        .crm-boot-ring,
        .crm-boot-bar {
          animation: none;
        }

        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-busy="true" aria-live="polite" aria-label="Loading">
        <div class="boot-side"></div>
        <div class="boot-main">
          <div class="boot-head"></div>
          <div class="boot-body">
            <div class="crm-boot-track" aria-hidden="true"><div class="crm-boot-bar"></div></div>
            <div class="crm-boot-body">
              <div class="crm-boot-mark" aria-hidden="true">
                <span class="crm-boot-halo"></span>
                <span class="crm-boot-ring"></span>
                <span class="crm-boot-core">FI</span>
              </div>
              <p class="crm-boot-label">Loading</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
