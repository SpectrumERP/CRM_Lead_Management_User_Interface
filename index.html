<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spectrum ERP CRM</title>
    <!-- Square Spectrum ERP icons (the old wide logo was squashed into the tab). -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- App shell paint before JS: the app's shape (sidebar, header, a page of cards and rows) in skeleton bars with
         one soft band of light passing over them, the same markup and classes as Spectrum ERP's loading screen and
         src/ui/Skeleton.tsx's BootShell (keep them in step), so start-up, the session check and switching between
         the apps never flash a blank page. On the sign-in path it paints the sign-in page's shape. -->
    <script>
      // Theme before first paint (shared with Task Management: `steelmont-theme`; CRM default light).
      (function () {
        try {
          var t = localStorage.getItem('steelmont-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          if (localStorage.getItem('fi-crm-sidebar-collapsed') === '1') {
            document.documentElement.setAttribute('data-boot-sidebar', 'collapsed');
          }
        } catch (e) {}
        // Every page but the sign-in has the sidebar and header.
        if (!/\/login\/?$/.test(location.pathname)) {
          document.documentElement.setAttribute('data-boot-chrome', '');
        }
        // The skeleton light's place on the page's clock (2s a pass, as in src/ui/Skeleton.tsx).
        var now = Number((document.timeline && document.timeline.currentTime) || performance.now());
        document.documentElement.style.setProperty('--skeleton-phase', '-' + Math.round(now % 2000) + 'ms');
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #f4f6fa;
      }

      html.dark,
      html.dark body {
        background: #0b1220;
      }

      /* Same-origin page swaps (CRM <-> Task) cross-fade instead of cutting. */
      @view-transition {
        navigation: auto;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 180ms;
        animation-timing-function: ease-out;
      }

      /* The app's stylesheet makes every box border-box; the same here, so React taking over moves nothing. */
      .boot-shell,
      .boot-shell * {
        box-sizing: border-box;
      }

      .boot-shell {
        display: flex;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #f4f6fa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      html.dark .boot-shell {
        background: #0b1220;
      }

      .boot-side {
        display: none;
        flex-shrink: 0;
        width: 224px;
        background: #1e56a0;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
      }

      html.dark .boot-side {
        background: #121a2b;
        border-right-color: #2a3548;
      }

      html[data-boot-sidebar='collapsed'] .boot-side {
        width: 56px;
      }

      @media (min-width: 1024px) {
        .boot-side {
          display: block;
        }
      }

      .boot-main {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
      }

      .boot-head {
        flex-shrink: 0;
        height: 56px;
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
      }

      html.dark .boot-head {
        background: #121a2b;
        border-color: #2a3548;
      }

      .boot-body {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      /*
        A skeleton bar. One band of light passes over the whole screen: each bar's background is fixed to the viewport,
        so it shows its slice of the same band, on the page's clock (--skeleton-phase, set above), so the bars React puts
        in their place carry on the same sweep. Same look and timing as .skeleton in src/index.css.
      */
      .bsk {
        --skeleton-light: rgba(255, 255, 255, 0.7);
        display: block;
        flex-shrink: 1;
        min-width: 0;
        border-radius: 4px;
        background-color: #e2e8f0;
        background-image: linear-gradient(100deg, transparent 38%, var(--skeleton-light) 50%, transparent 62%);
        background-size: 100vw 100vh;
        background-repeat: no-repeat;
        background-attachment: fixed;
        animation: boot-sweep 2s linear var(--skeleton-phase, 0s) infinite;
      }

      html.dark .bsk {
        --skeleton-light: rgba(255, 255, 255, 0.05);
        background-color: #1f2a3d;
      }

      /* On the blue left panel and the sign-in brand panel, in either theme. */
      html .boot-side .bsk,
      html .boot-brand .bsk {
        --skeleton-light: rgba(255, 255, 255, 0.12);
        background-color: rgba(255, 255, 255, 0.15);
      }

      @keyframes boot-sweep {
        0% {
          background-position: -65vw 0;
        }

        75%,
        100% {
          background-position: 65vw 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bsk {
          animation: none;
          background-image: none;
        }
      }

      /* Left panel: the logo, then the menu's tiles and names. */
      .boot-side-logo {
        display: flex;
        height: 56px;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .boot-side-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 8px;
      }

      .boot-side-item {
        display: flex;
        height: 36px;
        align-items: center;
        gap: 12px;
        padding: 0 10px;
      }

      html[data-boot-sidebar='collapsed'] .boot-side-item {
        justify-content: center;
        padding: 0;
      }

      html[data-boot-sidebar='collapsed'] .boot-side .bsk-label {
        display: none;
      }

      /* Header: the logo (dashboard only, which has no left panel), the search, the action icons and the user. */
      .boot-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        box-sizing: border-box;
      }

      .boot-head-logo {
        display: none;
      }

      html[data-boot-no-sidebar] .boot-shell:not(.boot-chrome) .boot-head-logo,
      .boot-shell.boot-no-sidebar .boot-head-logo {
        display: block;
      }

      .boot-head-search {
        display: none;
        margin: 0 auto;
      }

      @media (min-width: 768px) {
        .boot-head-search {
          display: block;
        }
      }

      .boot-head-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .bsk-round {
        border-radius: 999px;
      }

      /* The page: its breadcrumb strip, title, key-figure cards and a list. */
      .boot-page {
        padding: 0 24px 24px;
      }

      .boot-strip {
        display: flex;
        height: 40px;
        align-items: center;
        gap: 8px;
        margin: 0 -24px 20px;
        padding: 0 20px;
        box-sizing: border-box;
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
      }

      .boot-cards {
        display: grid;
        gap: 12px;
        margin: 16px 0 20px;
      }

      @media (min-width: 640px) {
        .boot-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1280px) {
        .boot-cards {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      .boot-card,
      .boot-panel {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
      }

      .boot-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
      }

      .boot-lines {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        gap: 8px;
      }

      .boot-panel {
        overflow: hidden;
      }

      .boot-panel-head {
        display: flex;
        height: 44px;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        box-sizing: border-box;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
      }

      .boot-row {
        display: flex;
        gap: 24px;
        padding: 14px 16px;
        border-bottom: 1px solid #eef2f6;
      }

      .boot-row:last-child {
        border-bottom: 0;
      }

      html.dark .boot-strip,
      html.dark .boot-card,
      html.dark .boot-panel {
        background: #121a2b;
        border-color: #2a3548;
      }

      html.dark .boot-panel-head {
        background: #151d2e;
        border-color: #2a3548;
      }

      html.dark .boot-row {
        border-color: #1f2a3d;
      }

      /* Sign-in page: the brand panel (wide screens) and the form. Shown only on the login path, before React. */
      .boot-login {
        display: none;
        min-height: 100%;
        background: #fff;
      }

      html:not([data-boot-chrome]) .boot-shell:not(.boot-chrome) .boot-login {
        display: grid;
      }

      html:not([data-boot-chrome]) .boot-shell:not(.boot-chrome) .boot-page {
        display: none;
      }

      .boot-brand {
        display: none;
        flex-direction: column;
        gap: 14px;
        padding: 40px 20px;
        background-image: linear-gradient(160deg, #1e56a0, #17457f 55%, #0c1a3a);
      }

      @media (min-width: 1024px) {
        .boot-login {
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        }

        .boot-brand {
          display: flex;
        }
      }

      .boot-form {
        display: flex;
        width: 100%;
        max-width: 380px;
        flex-direction: column;
        gap: 10px;
        margin: auto;
        padding: 40px 20px;
        box-sizing: border-box;
      }

      /* React's sign-in shape (BootLogin) on a sign-in reached in the app, whatever the first page was. */
      .boot-shell.boot-signin .boot-login {
        display: grid;
      }

      html.dark .boot-login {
        background: #121a2b;
      }

      /* The login page: no chrome (React adds .boot-chrome where it wants it). */
      html:not([data-boot-chrome]) .boot-shell:not(.boot-chrome) .boot-side,
      html:not([data-boot-chrome]) .boot-shell:not(.boot-chrome) .boot-head {
        display: none;
      }

      html[data-boot-no-sidebar] .boot-shell:not(.boot-chrome) .boot-side,
      .boot-shell.boot-no-sidebar .boot-side {
        display: none;
      }

      /* Inside the shell layout (a workspace module loading): fills the content area. */
      .boot-shell.boot-area {
        height: 100%;
        min-height: 16rem;
        background: transparent;
      }

      /* The shell's content pane already has its padding, and the module brings its own breadcrumb strip. */
      .boot-shell.boot-area .boot-page {
        padding: 0;
      }

      .boot-shell.boot-area .boot-strip {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>

        <div class="boot-side" aria-hidden="true">

          <div class="boot-side-nav">
            <div class="boot-side-item">
              <span class="bsk" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px"></span

            </div>
            <div class="boot-side-item">
              <span class="bsk" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px"></span
              ><span class="bsk bsk-label" style="width: 48%; height: 11px"></span>
            </div>
            <div class="boot-side-item">
              <span class="bsk" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px"></span
              ><span class="bsk bsk-label" style="width: 70%; height: 11px"></span>
            </div>
            <div class="boot-side-item">
              <span class="bsk" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px"></span
              ><span class="bsk bsk-label" style="width: 54%; height: 11px"></span>
            </div>
            <div class="boot-side-item">
              <span class="bsk" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px"></span
              ><span class="bsk bsk-label" style="width: 66%; height: 11px"></span>
            </div>
            <div class="boot-side-item">
              <span class="bsk" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px"></span
              ><span class="bsk bsk-label" style="width: 44%; height: 11px"></span>
            </div>
            <div class="boot-side-item">
              <span class="bsk" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px"></span
              ><span class="bsk bsk-label" style="width: 58%; height: 11px"></span>
            </div>
          </div>
        </div>
        <div class="boot-main">
          <div class="boot-head" aria-hidden="true">
            <span class="boot-head-logo"><span class="bsk" style="width: 120px; height: 28px"></span></span>
            <span class="boot-head-search"><span class="bsk" style="width: min(22rem, 40vw); height: 36px"></span></span>
            <span class="boot-head-actions"
              ><span class="bsk bsk-round" style="width: 32px; height: 32px"></span><span class="bsk bsk-round" style="width: 32px; height: 32px"></span
              ><span class="bsk bsk-round" style="width: 32px; height: 32px"></span><span class="bsk" style="width: 120px; height: 32px"></span
            ></span>
          </div>
          <div class="boot-body" aria-hidden="true">
            <div class="boot-page">
              <div class="boot-strip">
                <span class="bsk" style="width: 64px; height: 12px"></span><span class="bsk" style="width: 140px; height: 12px"></span>
              </div>
              <span class="bsk" style="width: 220px; height: 20px"></span>
              <div class="boot-cards">
                <div class="boot-card">
                  <span class="bsk" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px"></span
                  ><span class="boot-lines"
                    ><span class="bsk" style="width: 40%; height: 12px"></span><span class="bsk" style="width: 56px; height: 24px"></span
                    ><span class="bsk" style="width: 70%; height: 10px"></span
                  ></span>
                </div>
                <div class="boot-card">
                  <span class="bsk" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px"></span
                  ><span class="boot-lines"
                    ><span class="bsk" style="width: 52%; height: 12px"></span><span class="bsk" style="width: 56px; height: 24px"></span
                    ><span class="bsk" style="width: 62%; height: 10px"></span
                  ></span>
                </div>
                <div class="boot-card">
                  <span class="bsk" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px"></span
                  ><span class="boot-lines"
                    ><span class="bsk" style="width: 46%; height: 12px"></span><span class="bsk" style="width: 56px; height: 24px"></span
                    ><span class="bsk" style="width: 76%; height: 10px"></span
                  ></span>
                </div>
                <div class="boot-card">
                  <span class="bsk" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px"></span
                  ><span class="boot-lines"
                    ><span class="bsk" style="width: 34%; height: 12px"></span><span class="bsk" style="width: 56px; height: 24px"></span
                    ><span class="bsk" style="width: 58%; height: 10px"></span
                  ></span>
                </div>
              </div>
              <div class="boot-panel">
                <div class="boot-panel-head">
                  <span class="bsk" style="width: 120px; height: 14px"></span><span class="bsk" style="width: 64px; height: 10px"></span>
                </div>
                <div class="boot-row">
                  <span class="bsk" style="width: 28%; height: 14px"></span><span class="bsk" style="width: 20%; height: 14px"></span
                  ><span class="bsk" style="width: 36%; height: 14px"></span><span class="bsk" style="width: 16%; height: 14px"></span>
                </div>
                <div class="boot-row">
                  <span class="bsk" style="width: 24%; height: 14px"></span><span class="bsk" style="width: 18%; height: 14px"></span
                  ><span class="bsk" style="width: 30%; height: 14px"></span><span class="bsk" style="width: 14%; height: 14px"></span>
                </div>
                <div class="boot-row">
                  <span class="bsk" style="width: 30%; height: 14px"></span><span class="bsk" style="width: 22%; height: 14px"></span
                  ><span class="bsk" style="width: 34%; height: 14px"></span><span class="bsk" style="width: 18%; height: 14px"></span>
                </div>
                <div class="boot-row">
                  <span class="bsk" style="width: 26%; height: 14px"></span><span class="bsk" style="width: 16%; height: 14px"></span
                  ><span class="bsk" style="width: 38%; height: 14px"></span><span class="bsk" style="width: 12%; height: 14px"></span>
                </div>
                <div class="boot-row">
                  <span class="bsk" style="width: 28%; height: 14px"></span><span class="bsk" style="width: 20%; height: 14px"></span
                  ><span class="bsk" style="width: 32%; height: 14px"></span><span class="bsk" style="width: 16%; height: 14px"></span>
                </div>
                <div class="boot-row">
                  <span class="bsk" style="width: 22%; height: 14px"></span><span class="bsk" style="width: 18%; height: 14px"></span
                  ><span class="bsk" style="width: 36%; height: 14px"></span><span class="bsk" style="width: 14%; height: 14px"></span>
                </div>
              </div>
            </div>
            <div class="boot-login">
              <div class="boot-brand">
                <span class="bsk" style="width: 160px; height: 40px"></span><span style="flex: 1"></span
                ><span class="bsk" style="width: 70%; height: 28px"></span><span class="bsk" style="width: 55%; height: 28px"></span
                ><span class="bsk" style="width: 80%; height: 12px"></span><span class="bsk" style="width: 64%; height: 12px"></span
                ><span style="flex: 1"></span>
              </div>
              <div class="boot-form">
                <span class="bsk" style="width: 150px; height: 24px"></span><span class="bsk" style="width: 220px; height: 12px"></span
                ><span style="height: 12px"></span> <span class="bsk" style="width: 80px; height: 12px"></span
                ><span class="bsk" style="width: 100%; height: 42px"></span><span style="height: 4px"></span>
                <span class="bsk" style="width: 72px; height: 12px"></span><span class="bsk" style="width: 100%; height: 42px"></span
                ><span style="height: 4px"></span> <span class="bsk" style="width: 90px; height: 12px"></span
                ><span class="bsk" style="width: 100%; height: 42px"></span><span style="height: 10px"></span>
                <span class="bsk" style="width: 100%; height: 44px"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
